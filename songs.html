<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem("stackato:theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>

j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Every song on Riffraff. Open one to listen, add a layer or build your own version.">
<title>Riffraff — all songs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="Stakkato, home">
      <img class="logo" src="/stakkato-logo.svg" alt="Stakkato" width="1760" height="384"><img class="logo on-dark" src="/stakkato-logo-on-dark.svg" alt="Stakkato" width="1760" height="384">
    </a>
    <div class="session">All songs<br><span id="songs-count">loading</span></div>
    <span data-theme-toggle style="margin-left:auto"></span>
    <a class="btn btn-sm" href="/new">Start a new song</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="head" style="margin-top:4px">
      <div>
        <div class="kicker">On Riffraff</div>
        <h2>All songs</h2>
      </div>
      <p>Every song anyone has started, newest first. Open one to listen, add a layer or build your own version.</p>
    </div>
    <div class="songfilter" role="tablist" aria-label="Which songs">
      <button type="button" role="tab" data-filter="all" aria-selected="true">All</button>
      <button type="button" role="tab" data-filter="open" aria-selected="false">Open for layers</button>
      <button type="button" role="tab" data-filter="released" aria-selected="false">Released</button>
    </div>
    <div class="songlist" id="songs" aria-live="polite"></div>
    <div class="strip" id="strip" aria-hidden="true"></div>
  </div>
</main>

<script type="module" src="/src/analytics.js"></script>
<script type="module" src="/src/songs.js"></script>
</body>
</html>
